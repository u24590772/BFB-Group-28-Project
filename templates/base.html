<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} – FinFlow</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark"></span>FinFlow</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        <a href="{{ url_for('sales_flow') }}" {% if request.endpoint == 'sales_flow' %}aria-current="page"{% endif %}>Sales flow</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>FinFlow is a BFB 321 project by Group 28 for Fintr. All orders shown are synthetic demo data.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
